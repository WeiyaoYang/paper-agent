[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-paper-agent"
version = "0.1.0"
description = "Personal paper learning agent with interactive planning, behaviors and verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pdfplumber>=0.11,<0.12", "jsonschema>=4,<5"]

[project.optional-dependencies]
docling = ["docling>=2.70,<3"]
models = ["openai>=2,<4", "python-dotenv>=1,<2"]
desktop = ["PySide6>=6.8,<7"]
build = ["pyinstaller>=6.16,<7"]

[project.scripts]
paper-agent = "paper_agent.app.cli:main"
paper-agent-desktop = "paper_agent.app.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]
